<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程编辑器 - 猴子课堂</title><link rel="stylesheet" href="/static/styles.css"></head><body data-page="editor"><header class="top"><div class="shell"><div class="brand">猴子 <span>课堂</span></div><nav class="nav"><a href="/static/home.html">首页</a><a href="/static/my-courses.html">我的课程</a><a class="active" data-admin href="/static/admin.html">管理后台</a><span data-user class="user"></span><button data-logout>退出</button></nav></div></header><main class="shell main"><a class="link-button back" href="/static/admin.html">← 返回管理后台</a><div class="panel"><h1 id="editor-title">课程编辑器</h1><p id="editor-description" class="muted"></p></div><div class="detail" style="margin-top:20px"><section class="panel"><h2>课程目录</h2><div id="editor-chapters"></div></section><aside><form id="chapter-form" class="panel"><h2>新增章节</h2><label>章节名称<input name="title" required placeholder="例如：第一章 课程导学"></label><button class="primary wide">创建章节</button></form><form id="lesson-form" class="panel" style="margin-top:18px"><h2>新增课时并上传视频</h2><label>所属章节<select id="chapter-select" name="chapter_id" required></select></label><label>课时名称<input name="title" required placeholder="例如：1.1 课程介绍"></label><label><input type="checkbox" name="is_preview"> 允许未授权学员试听</label><label>MP4 视频<input id="video-file" name="video" type="file" accept="video/mp4,.mp4" required></label><p id="video-meta" class="muted">选择 MP4 后自动读取实际时长。</p><button class="primary wide">创建课时并上传</button></form></aside></div></main><script src="/static/app.js"></script></body></html>
